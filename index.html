<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Main Hub & Directory</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 0;
      display: flex;
      height: 100vh;
      background: #f4f6f8;
      color: #333;
    }
    .sidebar {
      width: 320px;
      background: #ffffff;
      border-right: 1px solid #e1e4e8;
      padding: 20px;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
    }
    h1 {
      font-size: 1.2rem;
      margin-top: 0;
      margin-bottom: 20px;
      padding-bottom: 10px;
      border-bottom: 2px solid #0969da;
    }
    .page-list {
      list-style: none;
      padding: 0;
      margin: 0;
    }
    .page-item {
      margin-bottom: 8px;
    }
    .page-link {
      display: block;
      padding: 10px 14px;
      background: #f8f9fa;
      border: 1px solid #e1e4e8;
      border-radius: 6px;
      text-decoration: none;
      color: #0969da;
      font-weight: 500;
      transition: all 0.2s ease;
      cursor: pointer;
    }
    .page-link:hover, .page-link.active {
      background: #0969da;
      color: #ffffff;
      border-color: #0969da;
    }
    .preview-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: #ffffff;
    }
    .preview-header {
      padding: 12px 20px;
      background: #ffffff;
      border-bottom: 1px solid #e1e4e8;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.9rem;
    }
    .external-btn {
      padding: 6px 12px;
      background: #2da44e;
      color: white;
      text-decoration: none;
      border-radius: 6px;
      font-weight: 500;
    }
    .external-btn:hover { background: #2c974b; }
    iframe {
      width: 100%;
      flex: 1;
      border: none;
      background: #ffffff;
    }
    .loading-text, .error-text {
      color: #6e7781;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>

  <div class="sidebar">
    <h1>Pages Directory</h1>
    <ul id="pageList" class="page-list">
      <li class="loading-text">Scanning HTML files...</li>
    </ul>
  </div>

  <div class="preview-container">
    <div class="preview-header">
      <span id="previewTitle">Select a page to preview</span>
      <a id="openNewTab" href="#" target="_blank" class="external-btn" style="display: none;">Open in New Tab ↗</a>
    </div>
    <iframe id="previewFrame" src="about:blank"></iframe>
  </div>

  <script>
    const hostParts = window.location.hostname.split('.');
    const pathParts = window.location.pathname.split('/').filter(p => p.length > 0);

    const GITHUB_USER = hostParts[1] === 'github' ? hostParts[0] : 'YOUR_GITHUB_USERNAME';
    const REPO_NAME = pathParts.length > 0 ? pathParts[0] : 'YOUR_REPO_NAME';

    async function fetchHtmlFiles() {
      const apiUrl = `https://api.github.com/repos/${GITHUB_USER}/${REPO_NAME}/contents/`;
      
      try {
        const response = await fetch(apiUrl);
        if (!response.ok) throw new Error(`HTTP Error ${response.status}`);
        
        const files = await response.json();

        // 篩選出同層級的 .html 檔案（排除 index.html 自身）
        const htmlFiles = files.filter(item => 
          item.type === 'file' && 
          item.name.endsWith('.html') && 
          item.name.toLowerCase() !== 'index.html'
        );

        renderPageList(htmlFiles);
      } catch (error) {
        console.error(error);
        document.getElementById('pageList').innerHTML = `<li class="error-text">Failed to load pages: ${error.message}</li>`;
      }
    }

    function renderPageList(files) {
      const listElement = document.getElementById('pageList');
      listElement.innerHTML = '';

      if (files.length === 0) {
        listElement.innerHTML = '<li class="loading-text">No other HTML files found.</li>';
        return;
      }

      files.forEach((file, index) => {
        const li = document.createElement('li');
        li.className = 'page-item';
        
        // 格式化檔名顯示 (例如 lab.html -> Lab)
        const cleanName = file.name.replace('.html', '').replace(/-/g, ' ');
        const displayName = cleanName.charAt(0).toUpperCase() + cleanName.slice(1);

        const a = document.createElement('a');
        a.className = 'page-link';
        a.textContent = displayName;
        a.href = `./${file.name}`;
        
        a.addEventListener('click', (e) => {
          e.preventDefault();
          setPreview(`./${file.name}`, displayName);
          
          document.querySelectorAll('.page-link').forEach(link => link.classList.remove('active'));
          a.classList.add('active');
        });

        li.appendChild(a);
        listElement.appendChild(li);

        // 預設載入第一個 HTML 頁面進行預覽
        if (index === 0) {
          a.click();
        }
      });
    }

    function setPreview(url, title) {
      const frame = document.getElementById('previewFrame');
      const titleElement = document.getElementById('previewTitle');
      const externalBtn = document.getElementById('openNewTab');

      frame.src = url;
      titleElement.textContent = `Preview: ${title}`;
      externalBtn.href = url;
      externalBtn.style.display = 'inline-block';
    }

    fetchHtmlFiles();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Mirror Chamber: Psychological Space UI/UX Design</title>
    <style>
        :root {
            --win-bg: #c0c0c0;
            --win-border-light: #ffffff;
            --win-border-dark: #808080;
            --win-border-darker: #000000;
            --title-blue: #000080;
            --title-text: #ffffff;
            --desktop-bg: #008080;
            --text-color: #000000;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--desktop-bg);
            font-family: "MS Sans Serif", Tahoma, Geneva, sans-serif;
            color: var(--text-color);
        }

        /* Psychological Visual Snow / Noise & Scanline Layer */
        #noise-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
            opacity: 0.04;
            filter: blur(16px);
        }

        .crt-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%);
            background-size: 100% 4px;
            z-index: 11;
            opacity: 0.6;
        }

        /* Desktop Container */
        #desktop {
            position: relative;
            width: 100vw;
            height: calc(100vh - 36px);
            padding: 20px;
            display: flex;
            flex-direction: column;
            flex-wrap: wrap;
            align-content: flex-start;
            gap: 20px;
            z-index: 5;
        }

        /* Desktop Icons */
        .desktop-icon {
            width: 80px;
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            color: #ffffff;
            text-shadow: 1px 1px 1px #000000;
        }

        .desktop-icon-img {
            width: 40px;
            height: 40px;
            background: #ffffff;
            border: 2px outset #ffffff;
            margin-bottom: 6px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
        }

        .desktop-icon-label {
            font-size: 11px;
            text-align: center;
            word-break: break-all;
            padding: 2px 4px;
        }

        .desktop-icon:hover .desktop-icon-label {
            background-color: var(--title-blue);
        }

        /* Retro Window Styling - Dynamic Autosize Around Image */
        .win-window {
            position: absolute;
            background: var(--win-bg);
            border-top: 2px solid var(--win-border-light);
            border-left: 2px solid var(--win-border-light);
            border-right: 2px solid var(--win-border-darker);
            border-bottom: 2px solid var(--win-border-darker);
            box-shadow: inset 1px 1px 0 #dfdfdf, inset -1px -1px 0 var(--win-border-dark);
            display: flex;
            flex-direction: column;
            z-index: 20;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: auto;
            height: auto;
            max-width: 85vw;
            max-height: 80vh;
            padding: 3px;
        }

        .win-window.hidden {
            display: none;
        }

        .win-titlebar {
            background: var(--title-blue);
            color: var(--title-text);
            padding: 3px 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: bold;
            font-size: 12px;
            letter-spacing: 0.5px;
            flex-shrink: 0;
            margin-bottom: 3px;
        }

        .win-title-controls {
            display: flex;
            gap: 2px;
        }

        .win-btn {
            width: 16px;
            height: 14px;
            background: var(--win-bg);
            border-top: 1px solid var(--win-border-light);
            border-left: 1px solid var(--win-border-light);
            border-right: 1px solid var(--win-border-darker);
            border-bottom: 1px solid var(--win-border-darker);
            font-size: 9px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            color: #000;
            font-weight: bold;
        }

        .win-btn:active {
            border-top: 1px solid var(--win-border-darker);
            border-left: 1px solid var(--win-border-darker);
            border-right: 1px solid var(--win-border-light);
            border-bottom: 1px solid var(--win-border-light);
        }

        .win-content {
            flex: 1;
            padding: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: var(--win-bg);
            overflow: hidden;
            position: relative;
        }

        /* Photo Display Frame & Canvas */
        .photo-frame {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            background: var(--win-bg);
            border-top: 1px solid var(--win-border-dark);
            border-left: 1px solid var(--win-border-dark);
            border-right: 1px solid var(--win-border-light);
            border-bottom: 1px solid var(--win-border-light);
            padding: 4px;
        }

        .shard-canvas {
            display: block;
            max-width: 70vw;
            max-height: 65vh;
            width: auto;
            height: auto;
            background: transparent;
        }

        /* Waveform Monitor Box */
        #waveform-box {
            position: fixed;
            top: 20px;
            right: 20px;
            width: 220px;
            height: 110px;
            background: #000000;
            border: 2px solid var(--win-border-dark);
            z-index: 150;
            display: flex;
            flex-direction: column;
            padding: 4px;
        }

        #waveform-title {
            color: #00ff00;
            font-size: 10px;
            font-family: monospace;
            margin-bottom: 2px;
        }

        #waveform-canvas {
            width: 100%;
            height: 80px;
            background: #051005;
            border: 1px solid #004400;
        }

        /* Psychological HUD Annotations */
        .hud-annotation {
            position: absolute;
            font-size: 11px;
            letter-spacing: 1px;
            color: rgba(255, 255, 255, 0.7);
            text-shadow: 1px 1px 2px #000;
            pointer-events: none;
            font-weight: normal;
            z-index: 25;
            transition: opacity 0.8s ease;
            white-space: nowrap;
        }

        /* Taskbar Styling */
        #taskbar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 36px;
            background: var(--win-bg);
            border-top: 2px solid var(--win-border-light);
            display: flex;
            align-items: center;
            padding: 3px 6px;
            gap: 8px;
            z-index: 100;
        }

        #taskbar-status {
            font-size: 11px;
            color: #333;
            flex: 1;
            padding: 2px 6px;
            background: #fff;
            border-top: 1px solid var(--win-border-dark);
            border-left: 1px solid var(--win-border-dark);
            border-bottom: 1px solid var(--win-border-light);
            border-right: 1px solid var(--win-border-light);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        /* Hidden Webcam Video for MediaPipe FaceMesh */
        #webcam-video {
            position: fixed;
            bottom: 45px;
            right: 10px;
            width: 120px;
            height: 90px;
            object-fit: cover;
            border: 2px solid var(--win-border-dark);
            z-index: 200;
            display: none;
            transform: scaleX(-1);
        }

        /* Mode Switch Controls in Taskbar */
        .taskbar-btn {
            background: var(--win-bg);
            border-top: 1px solid var(--win-border-light);
            border-left: 1px solid var(--win-border-light);
            border-right: 1px solid var(--win-border-darker);
            border-bottom: 1px solid var(--win-border-darker);
            padding: 3px 8px;
            font-size: 11px;
            cursor: pointer;
            height: 26px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .taskbar-btn.active {
            background: #e0e0e0;
            border-top: 1px solid var(--win-border-darker);
            border-left: 1px solid var(--win-border-darker);
            border-right: 1px solid var(--win-border-light);
            border-bottom: 1px solid var(--win-border-light);
        }

        #clock {
            font-size: 11px;
            padding: 2px 8px;
            background: var(--win-bg);
            border-top: 1px solid var(--win-border-dark);
            border-left: 1px solid var(--win-border-dark);
            border-bottom: 1px solid var(--win-border-light);
            border-right: 1px solid var(--win-border-light);
        }
    </style>
</head>
<body>

    <canvas id="noise-canvas"></canvas>
    <div class="crt-overlay"></div>

    <!-- Dynamic HUD Annotation Container -->
    <div id="annotation-layer"></div>

    <!-- Real-time Eye Waveform Monitor -->
    <div id="waveform-box">
        <div id="waveform-title">BLINK SWITCH WAVEFORM [L:GRN R:YEL]</div>
        <canvas id="waveform-canvas" width="210" height="80"></canvas>
    </div>

    <!-- Desktop with File Icons -->
    <div id="desktop">
        <div class="desktop-icon" onclick="openPhotoWindow(0)">
            <div class="desktop-icon-img">🖼️</div>
            <div class="desktop-icon-label">Portrait_01.bmp</div>
        </div>
        <div class="desktop-icon" onclick="openPhotoWindow(1)">
            <div class="desktop-icon-img">🖼️</div>
            <div class="desktop-icon-label">Portrait_02.bmp</div>
        </div>
        <div class="desktop-icon" onclick="openPhotoWindow(2)">
            <div class="desktop-icon-img">🖼️</div>
            <div class="desktop-icon-label">Portrait_03.bmp</div>
        </div>
    </div>

    <!-- Retro Viewer Window -->
    <div class="win-window hidden" id="photo-window">
        <div class="win-titlebar">
            <span id="window-title">Portrait_01.bmp - Image Viewer</span>
            <div class="win-title-controls">
                <div class="win-btn" onclick="closePhotoWindow()">X</div>
            </div>
        </div>
        <div class="win-content">
            <div class="photo-frame">
                <canvas class="shard-canvas" id="main-canvas"></canvas>
            </div>
        </div>
    </div>

    <!-- Hidden Webcam for MediaPipe FaceMesh -->
    <video id="webcam-video" autoplay playsinline></video>

    <!-- Taskbar -->
    <div id="taskbar">
        <button class="taskbar-btn active" id="mode-webcam">Blink Mode</button>
        <button class="taskbar-btn" id="mode-sim">Simulated Mode</button>
        <div id="taskbar-status">SYSTEM READY. DOUBLE CLICK AN ICON TO OPEN.</div>
        <div id="clock">12:00 PM</div>
    </div>

    <!-- MediaPipe FaceMesh & Camera Utils CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>

    <script>
        // --- Clock Update ---
        function updateClock() {
            const now = new Date();
            let hours = now.getHours();
            const minutes = now.getMinutes().toString().padStart(2, '0');
            const ampm = hours >= 12 ? 'PM' : 'AM';
            hours = hours % 12;
            hours = hours ? hours : 12;
            document.getElementById('clock').innerText = `${hours}:${minutes} ${ampm}`;
        }
        setInterval(updateClock, 1000);
        updateClock();

        // --- Visual Snow / Noise Generator ---
        const noiseCanvas = document.getElementById('noise-canvas');
        const noiseCtx = noiseCanvas.getContext('2d');
        function resizeNoise() {
            noiseCanvas.width = window.innerWidth;
            noiseCanvas.height = window.innerHeight;
            generateNoise();
        }
        function generateNoise() {
            const w = noiseCanvas.width;
            const h = noiseCanvas.height;
            const idata = noiseCtx.createImageData(w, h);
            const buffer32 = new Uint32Array(idata.data.buffer);
            for (let i = 0; i < buffer32.length; i++) {
                if (Math.random() < 0.08) {
                    buffer32[i] = 0xffffffff;
                }
            }
            noiseCtx.putImageData(idata, 0, 0);
        }
        window.addEventListener('resize', resizeNoise);
        resizeNoise();

        // --- Image Files Definition ---
        const photoFiles = [
            { name: "Portrait_01.bmp", nor: 'img/face1_nor.png', twisted: 'img/face1_twisted.png' },
            { name: "Portrait_02.bmp", nor: 'img/face2_nor.png', twisted: 'img/face2_twisted.png' },
            { name: "Portrait_03.bmp", nor: 'img/face3_nor.png', twisted: 'img/face3_twisted.png' }
        ];

        let currentPhotoIndex = 0;
        let isWindowOpen = false;

        // --- Waveform Monitor Buffer ---
        const waveCanvas = document.getElementById('waveform-canvas');
        const waveCtx = waveCanvas.getContext('2d');
        const waveLeftData = new Array(100).fill(0.5);
        const waveRightData = new Array(100).fill(0.5);

        function drawWaveform() {
            const w = waveCanvas.width;
            const h = waveCanvas.height;
            waveCtx.clearRect(0, 0, w, h);

            waveCtx.strokeStyle = '#003300';
            waveCtx.beginPath();
            waveCtx.moveTo(0, h / 2);
            waveCtx.lineTo(w, h / 2);
            waveCtx.stroke();

            // Draw Left Eye EAR (Green)
            waveCtx.strokeStyle = '#00ff00';
            waveCtx.lineWidth = 1.5;
            waveCtx.beginPath();
            for (let i = 0; i < waveLeftData.length; i++) {
                const x = (i / (waveLeftData.length - 1)) * w;
                const y = h - (waveLeftData[i] * h);
                if (i === 0) waveCtx.moveTo(x, y);
                else waveCtx.lineTo(x, y);
            }
            waveCtx.stroke();

            // Draw Right Eye EAR (Yellow)
            waveCtx.strokeStyle = '#ffff00';
            waveCtx.lineWidth = 1.5;
            waveCtx.beginPath();
            for (let i = 0; i < waveRightData.length; i++) {
                const x = (i / (waveRightData.length - 1)) * w;
                const y = h - (waveRightData[i] * h);
                if (i === 0) waveCtx.moveTo(x, y);
                else waveCtx.lineTo(x, y);
            }
            waveCtx.stroke();
        }

        // --- Single Image Portrait Renderer (Blink Switch Mode) ---
        class PortraitRenderer {
            constructor(canvas) {
                this.canvas = canvas;
                this.ctx = canvas.getContext('2d');
                
                this.imgNor = new Image();
                this.imgTwisted = new Image();
                this.imagesLoaded = false;
                this.showTwisted = false;
            }

            loadPhoto(index) {
                this.imagesLoaded = false;
                this.showTwisted = false;
                let loadedCount = 0;
                const checkLoaded = () => {
                    loadedCount++;
                    if (loadedCount >= 2) {
                        this.imagesLoaded = true;
                        const nw = this.imgNor.naturalWidth || this.imgNor.width || 600;
                        const nh = this.imgNor.naturalHeight || this.imgNor.height || 800;
                        
                        this.canvas.width = nw;
                        this.canvas.height = nh;
                        this.draw();
                    }
                };

                this.imgNor = new Image();
                this.imgTwisted = new Image();
                this.imgNor.onload = checkLoaded;
                this.imgTwisted.onload = checkLoaded;

                this.imgNor.src = photoFiles[index].nor;
                this.imgTwisted.src = photoFiles[index].twisted;
            }

            toggleState() {
                this.showTwisted = !this.showTwisted;
                this.draw();
            }

            draw() {
                const w = this.canvas.width;
                const h = this.canvas.height;
                const ctx = this.ctx;

                ctx.clearRect(0, 0, w, h);
                if (!this.imagesLoaded) return;

                const activeImg = this.showTwisted ? this.imgTwisted : this.imgNor;
                ctx.drawImage(activeImg, 0, 0, w, h);
            }
        }

        const mainCanvas = document.getElementById('main-canvas');
        const portrait = new PortraitRenderer(mainCanvas);

        // --- Window Management ---
        function openPhotoWindow(index) {
            currentPhotoIndex = index;
            document.getElementById('window-title').innerText = `${photoFiles[index].name} - Image Viewer`;
            portrait.loadPhoto(index);
            document.getElementById('photo-window').classList.remove('hidden');
            isWindowOpen = true;
            statusText.innerText = `OPENED FILE: ${photoFiles[index].name} | BLINK TO SWITCH`;
        }

        function closePhotoWindow() {
            document.getElementById('photo-window').classList.add('hidden');
            isWindowOpen = false;
            statusText.innerText = "SYSTEM READY. DOUBLE CLICK AN ICON TO OPEN.";
            annotationLayer.innerHTML = '';
            activeAnnotations.length = 0;
        }

        // --- Self-Critical HUD Annotations System ---
        const annotationQuotes = [
            "Is this proportion right?",
            "Unsatisfied with this line",
            "Something feels off here",
            "Why does it look stiff?",
            "Needs subtle adjustment",
            "Too sharp, unnatural",
            "Symmetry seems unbalanced",
            "Slight error in detail"
        ];
        const annotationLayer = document.getElementById('annotation-layer');
        let annotationTimer = 0;
        const activeAnnotations = [];

        function updateAnnotations(dt) {
            if (!isWindowOpen) {
                annotationLayer.innerHTML = '';
                activeAnnotations.length = 0;
                return;
            }

            annotationTimer += dt;
            if (annotationTimer >= 3.8 && activeAnnotations.length < 2) {
                annotationTimer = 0;
                spawnAnnotation();
            }

            for (let i = activeAnnotations.length - 1; i >= 0; i--) {
                const ann = activeAnnotations[i];
                ann.elapsed += dt;
                const progress = ann.elapsed / ann.duration;

                if (progress >= 1.0) {
                    ann.element.remove();
                    activeAnnotations.splice(i, 1);
                } else {
                    if (progress < 0.25) {
                        ann.element.style.opacity = progress * 4;
                    } else if (progress > 0.75) {
                        ann.element.style.opacity = (1 - progress) * 4;
                    } else {
                        ann.element.style.opacity = 1;
                    }
                }
            }
        }

        function spawnAnnotation() {
            const text = annotationQuotes[Math.floor(Math.random() * annotationQuotes.length)];
            const el = document.createElement('div');
            el.className = 'hud-annotation';
            el.innerText = text;
            el.style.opacity = '0';

            const screenW = window.innerWidth;
            const screenH = window.innerHeight;
            const posX = Math.random() * (screenW * 0.6) + screenW * 0.2;
            const posY = Math.random() * (screenH * 0.6) + screenH * 0.2;

            el.style.left = `${posX}px`;
            el.style.top = `${posY}px`;
            annotationLayer.appendChild(el);

            const duration = 2.0 + Math.random() * 1.5;
            activeAnnotations.push({ element: el, elapsed: 0, duration: duration });
        }

        // --- High-Sensitivity Blink Detection Logic ---
        let isWebcamMode = true;
        let isBlinking = false;
        let lastBlinkTime = 0;

        const statusText = document.getElementById('taskbar-status');
        const webcamElement = document.getElementById('webcam-video');
        let lastTimestamp = performance.now();

        window.addEventListener('click', (e) => {
            if (!isWebcamMode && isWindowOpen) {
                portrait.toggleState();
            }
        });

        // --- MediaPipe FaceMesh High-Sensitivity Blink Detection ---
        let faceMesh = null;
        let cameraUtilsInstance = null;

        function calculateEAR(top, bottom, left, right) {
            const verticalDist = Math.hypot(top.x - bottom.x, top.y - bottom.y);
            const horizontalDist = Math.hypot(left.x - right.x, left.y - right.y);
            return verticalDist / (horizontalDist || 0.001);
        }

        function onResults(results) {
            if (!isWebcamMode) return;
            if (results.multiFaceLandmarks && results.multiFaceLandmarks.length > 0) {
                const landmarks = results.multiFaceLandmarks[0];

                const leftEAR = calculateEAR(landmarks[159], landmarks[145], landmarks[33], landmarks[133]);
                const rightEAR = calculateEAR(landmarks[386], landmarks[374], landmarks[362], landmarks[263]);
                const avgEAR = (leftEAR + rightEAR) / 2;

                waveLeftData.shift();
                waveLeftData.push(Math.max(0, Math.min(1, leftEAR * 5)));
                waveRightData.shift();
                waveRightData.push(Math.max(0, Math.min(1, rightEAR * 5)));

                // 調高閥值至 0.22，並將冷卻時間縮短至 300ms 以提升靈敏度
                const blinkThreshold = 0.22;
                const now = Date.now();

                if (avgEAR < blinkThreshold) {
                    if (!isBlinking && (now - lastBlinkTime > 300)) {
                        isBlinking = true;
                        lastBlinkTime = now;
                        if (isWindowOpen) {
                            portrait.toggleState();
                            statusText.innerText = `VIEWING: ${photoFiles[currentPhotoIndex].name} | BLINK DETECTED!`;
                        }
                    }
                } else {
                    isBlinking = false;
                }
            } else if (isWindowOpen) {
                statusText.innerText = `VIEWING: ${photoFiles[currentPhotoIndex].name} | FACE NOT DETECTED`;
            }
        }

        function initMediaPipe() {
            if (typeof FaceMesh === 'undefined') {
                statusText.innerText = 'MEDIAPIPE SCRIPT FAILED TO LOAD';
                return;
            }

            faceMesh = new FaceMesh({
                locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`
            });

            faceMesh.setOptions({
                maxNumFaces: 1,
                refineLandmarks: true,
                minDetectionConfidence: 0.6,
                minTrackingConfidence: 0.6
            });

            faceMesh.onResults(onResults);

            webcamElement.style.display = 'block';
            cameraUtilsInstance = new Camera(webcamElement, {
                onFrame: async () => {
                    if (isWebcamMode && webcamElement) {
                        await faceMesh.send({ image: webcamElement });
                    }
                },
                width: 640,
                height: 480
            });
            cameraUtilsInstance.start().then(() => {
                statusText.innerText = 'MODE: HIGH-SENSITIVITY BLINK ACTIVE';
            }).catch(err => {
                console.error('Camera start error:', err);
                statusText.innerText = 'CAMERA PERMISSION DENIED';
            });
        }

        function stopMediaPipe() {
            isWebcamMode = false;
            webcamElement.style.display = 'none';
            if (cameraUtilsInstance) {
                try { cameraUtilsInstance.stop(); } catch(e) {}
            }
        }

        document.getElementById('mode-webcam').addEventListener('click', () => {
            isWebcamMode = true;
            document.getElementById('mode-webcam').classList.add('active');
            document.getElementById('mode-sim').classList.remove('active');
            statusText.innerText = 'INITIALIZING BLINK DETECTION...';
            initMediaPipe();
        });

        document.getElementById('mode-sim').addEventListener('click', () => {
            stopMediaPipe();
            document.getElementById('mode-sim').classList.add('active');
            document.getElementById('mode-webcam').classList.remove('active');
            statusText.innerText = 'MODE: SIMULATED BLINK (CLICK SCREEN TO TOGGLE)';
        });

        // --- Main Loop ---
        function updateLoop(timestamp) {
            const dt = (timestamp - lastTimestamp) / 1000;
            lastTimestamp = timestamp;

            drawWaveform();
            updateAnnotations(dt);
            requestAnimationFrame(updateLoop);
        }

        initMediaPipe();
        requestAnimationFrame(updateLoop);
    </script>
</body>
</html>
